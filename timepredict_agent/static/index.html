<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TimePredict Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">T</div>
          <div>
            <h1>TimePredict Agent</h1>
            <p>时间序列论文管理台</p>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active" type="button" data-nav="library">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            论文库
          </button>
          <button class="nav-item" type="button" data-nav="triage">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            速筛看板
          </button>
          <button class="nav-item" type="button" data-nav="discovery">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            发现扩展
          </button>
          <button class="nav-item" type="button" data-nav="daily">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            每日推荐
          </button>
          <button class="nav-item" type="button" data-nav="expert">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            论文专家
          </button>
          <button class="nav-item" type="button" data-nav="report">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            阅读报告
          </button>
          <button class="nav-item" type="button" data-nav="settings">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            配置
          </button>
          <button class="nav-item" type="button" data-nav="generator">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            论文生成
          </button>
        </nav>

        <div class="side-section">
          <button class="side-label side-toggle" type="button" aria-expanded="false">
            快速筛选
            <svg class="toggle-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="quick-filters" hidden>
            <button data-keyword="predictive process monitoring" type="button">预测监控</button>
            <button data-keyword="remaining time prediction" type="button">剩余时间预测</button>
            <button data-keyword="business process remaining time prediction" type="button">业务剩余时间</button>
            <button data-keyword="event sequence prediction" type="button">事件序列预测</button>
            <button data-keyword="next event prediction" type="button">下一事件预测</button>
            <button data-keyword="next activity prediction" type="button">下一活动预测</button>
            <button data-keyword="event log prediction" type="button">事件日志预测</button>
            <button data-keyword="process mining" type="button">流程挖掘</button>
            <button data-keyword="incremental event log" type="button">增量事件日志</button>
            <button data-keyword="transformer" type="button">Transformer</button>
          </div>
        </div>

        <div class="side-section">
          <p class="side-label">论文来源</p>
          <div class="source-toggles">
            <label><input type="checkbox" name="source" value="arxiv" checked /> arXiv</label>
            <label><input type="checkbox" name="source" value="semantic_scholar" checked /> Semantic Scholar</label>
            <label><input type="checkbox" name="source" value="openalex" checked /> OpenAlex</label>
            <label><input type="checkbox" name="source" value="ieee_xplore" checked /> IEEE Xplore</label>
            <label><input type="checkbox" name="source" value="google_scholar" /> Google Scholar HTML</label>
          </div>
        </div>

        <div class="side-section side-footer">
          <button id="themeToggle" class="theme-toggle" type="button" title="切换深色/浅色模式">
            <svg class="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span id="themeLabel">深色模式</span>
          </button>
        </div>
      </aside>

      <main class="workspace">
        <button id="mobileMenuToggle" class="mobile-menu-toggle" type="button" title="打开菜单" aria-label="打开菜单">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
        <section class="workspace-intro">
          <div>
            <h2 id="viewTitle">论文库</h2>
            <p id="viewSubtitle">先收集候选论文，再按相关性、方法标签、引用和解读完整度筛出值得精读的内容。</p>
          </div>
          <div class="workflow-steps" aria-label="阅读流程">
            <span>发现</span>
            <span>速筛</span>
            <span>精读</span>
            <span>报告</span>
          </div>
        </section>
        <header class="toolbar">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="searchInput" type="search" placeholder="搜索本地论文；收集时也会作为检索关键词" />
            <button id="searchClear" class="search-clear" type="button" title="清空搜索" hidden>×</button>
          </div>
          <label class="number-field">
            数量
            <input id="maxResults" type="number" min="1" max="500" value="120" />
          </label>
          <label class="number-field">
            天数
            <input id="recentDays" type="number" min="1" max="3650" value="1095" />
          </label>
          <button id="addPaperButton" class="secondary-button" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加已读
          </button>
          <button id="uploadPaperButton" class="secondary-button" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            上传论文
          </button>
          <button id="collectButton" class="primary-button" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            多源收集
          </button>
          <button id="exportButton" class="secondary-button" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            导出报告
          </button>
        </header>

        <section class="metrics" aria-label="论文统计">
          <div>
            <span id="paperCount">0</span>
            <p>已收集论文</p>
          </div>
          <div>
            <span id="highCount">0</span>
            <p>精读候选</p>
          </div>
          <div>
            <span id="methodCount">0</span>
            <p>方法标签</p>
          </div>
          <div>
            <span id="latestDate">--</span>
            <p>最新日期</p>
          </div>
        </section>

        <div id="message" class="message" hidden></div>

        <section id="contentGrid" class="content-grid">
          <div class="paper-panel">
            <div class="panel-heading">
              <div>
                <h2 id="listTitle">论文列表</h2>
                <p id="listSubtitle">按发布时间倒序排列</p>
              </div>
              <div class="panel-heading-actions">
                <button id="expertPaperPanelToggle" class="paper-panel-toggle" type="button" title="收起咨询论文" hidden>收起</button>
                <button id="refreshButton" class="icon-button" type="button" title="刷新列表"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
              </div>
            </div>
            <div id="paperList" class="paper-list" aria-live="polite"></div>
          </div>

          <aside class="detail-panel">
            <button id="expertPaperRail" class="expert-paper-rail" type="button" title="展开咨询论文" hidden>展开咨询论文</button>
            <div id="paperDetail" class="paper-detail empty">
              <p class="empty-title">选择一篇论文</p>
              <p>左侧列表会展示收集到的论文，点击后可以查看中文摘要、关键要点、相关性判断和 PDF 链接。</p>
            </div>
          </aside>
        </section>

        <section id="generatorView" class="generator-view" hidden>
          <div class="generator-layout">
            <div class="generator-sidebar">
              <h3>选择模板论文</h3>
              <div id="templatePaperList" class="template-paper-list"></div>
              <div id="structurePreview" class="structure-preview" hidden>
                <h4>结构预览</h4>
                <div id="structureContent"></div>
              </div>
            </div>

            <div class="generator-main">
              <h3>论文内容</h3>
              <div class="generator-form">
                <label>
                  研究主题
                  <input id="paperTopic" type="text" placeholder="输入研究主题" />
                </label>
                <label>
                  大纲要点
                  <textarea id="paperOutline" placeholder="输入大纲要点，每行一个"></textarea>
                </label>
                <label>
                  代码片段（可选）
                  <textarea id="paperCode" placeholder="粘贴相关代码片段"></textarea>
                </label>
                <button id="generatePaperButton" class="primary-button" type="button">
                  生成论文
                </button>
              </div>
            </div>

            <div class="generator-preview">
              <div class="preview-header">
                <h3>生成结果</h3>
                <div class="preview-actions">
                  <button id="exportMarkdownButton" class="secondary-button" type="button" hidden>
                    导出 Markdown
                  </button>
                  <button id="exportPdfButton" class="secondary-button" type="button" hidden>
                    导出 PDF
                  </button>
                </div>
              </div>
              <div id="paperPreview" class="paper-preview">
                <p class="empty-preview">选择模板论文并填写内容后，点击"生成论文"按钮</p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
